dbg.no_globals:
  ja: "グローバル変数はありません"
  en: "No global variables"
dbg.chain_empty:
  ja: "'->' または '[]' の後に何もありません"
  en: "Nothing follows '->' or '[]'"
dbg.member_not_found:
  ja: "メンバ '%{field}' が見つかりません"
  en: "Member '%{field}' not found"
dbg.not_struct_or_pointer:
  ja: "'%{name}' は構造体でもポインタでもないため、'->%{field}' を評価できません"
  en: "'%{name}' is neither a struct nor a pointer, cannot evaluate '->%{field}'"
dbg.not_array_or_pointer:
  ja: "'%{name}' は配列でもポインタでもないため、'[%{idx}]' を評価できません"
  en: "'%{name}' is neither an array nor a pointer, cannot evaluate '[%{idx}]'"
dbg.write_unsupported_type:
  ja: "この型への書き込みには対応していません"
  en: "Writing to this type is not supported"
dbg.no_frame_base:
  ja: "frame_base 情報がありません"
  en: "No frame_base information available"
dbg.frame_base_parse_failed:
  ja: "frame_base の DWARF 式を解析できません"
  en: "Failed to parse the frame_base DWARF expression"
dbg.unsupported_frame_base_expr:
  ja: "対応していない frame_base 式です (opcode %{op})"
  en: "Unsupported frame_base expression (opcode %{op})"
dbg.no_var_location:
  ja: "変数の位置情報がありません"
  en: "No location information for the variable"
dbg.var_expr_parse_failed:
  ja: "変数の DWARF 式を解析できません"
  en: "Failed to parse the variable's DWARF expression"
dbg.dw_op_addr_missing_operand:
  ja: "DW_OP_addr のオペランドが不足しています"
  en: "DW_OP_addr is missing its operand"
dbg.unsupported_var_location_expr:
  ja: "対応していない変数位置式です (opcode %{op})"
  en: "Unsupported variable location expression (opcode %{op})"
dbg.unsupported_dwarf_reg:
  ja: "対応していない DWARF レジスタ番号です: %{other}"
  en: "Unsupported DWARF register number: %{other}"
dbg.reg_get_failed:
  ja: "レジスタ '%{name}' の取得に失敗しました"
  en: "Failed to read register '%{name}'"
dbg.mem_read_failed:
  ja: "メモリ読み取りに失敗"
  en: "Memory read failed"
dbg.mem_write_failed:
  ja: "メモリ書き込みに失敗"
  en: "Memory write failed"
dbg.no_symbols:
  ja: "シンボルが見つかりません"
  en: "No symbols found"
dbg.no_lineinfo:
  ja: "行番号情報が見つかりません(DWARF情報が無いか、指定した関数が見つかりません)"
  en: "No line info found (no DWARF info, or the specified function was not found)"
dbg.line_parse_failed:
  ja: "行番号の解析に失敗しました: '%{s}'"
  en: "Failed to parse line number: '%{s}'"
dbg.list_no_location:
  ja: "表示位置を特定できません。関数名か 'ファイル:行番号' を指定してください"
  en: "Cannot determine a location to show. Specify a function name or 'file:line'"
dbg.list_no_location_no_dwarf:
  ja: "表示位置を特定できません(DWARF情報がありません)"
  en: "Cannot determine a location to show (no DWARF info)"
dbg.addr_lineinfo_not_found:
  ja: "アドレス %{addr} に対応する行番号情報が見つかりません"
  en: "No line info found for address %{addr}"
dbg.function_not_found:
  ja: "関数 '%{name}' が見つかりません"
  en: "Function '%{name}' not found"
dbg.function_lineinfo_not_found:
  ja: "関数 '%{name}' の行番号情報が見つかりません(DWARF情報がありません)"
  en: "No line info found for function '%{name}' (no DWARF info)"
dbg.source_open_failed:
  ja: "ソースファイル '%{path}' を開けません"
  en: "Cannot open source file '%{path}'"
dbg.no_source_in_range:
  ja: "(指定した行番号の範囲にソースがありません)"
  en: "(No source in the specified line range)"
dbg.addr_parse_failed:
  ja: "アドレスの解析に失敗しました (16進数を指定してください)"
  en: "Failed to parse address (please specify a hexadecimal number)"
